# Azure Pipelines - CI/CD for CodeAlpha_ProjectName
# This pipeline: builds a Docker image, pushes it to Azure Container Registry,
# then deploys it to Azure App Service.

trigger:
  - main

variables:
  dockerRegistryServiceConnection: 'acr-connection'
  imageRepository: 'codealpha-devops-app'
  containerRegistry: 'codealphaacr786.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  webAppName: 'codealpha-devops-app-786'

stages:
  - stage: Build
    displayName: Build and Push Docker Image
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: Build and push image to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    jobs:
      - job: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy to App Service
            inputs:
              azureSubscription: 'azure-connection'
              appName: $(webAppName)
              containers: '$(containerRegistry)/$(imageRepository):$(tag)'
